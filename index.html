      font-family: 'Another Danger', system-ui, sans-serif;

      line-height: 1;

      display: inline-block;
      text-shadow:

    @keyframes glitchSlow {
      0%, 91%, 100% {
        transform: none;
      }
      92.5% {

        text-shadow:

      94% {

      }
    }

<body class="min-h-screen noise">
  <div id="app"></div>

  <script type="module">
    const MD = 'https://api.mangadex.org';
    const COVER = 'https://uploads.mangadex.org/covers';

    function getTitle(manga) {
      const t = manga.attributes?.title || {};
      return t.en || t['ja-ro'] || t.ja || Object.values(t)[0] || 'Unknown';
    }

    function getDescription(manga) {
      const d = manga.attributes?.description || {};
      return d.en || d.ja || Object.values(d)[0] || 'No description available.';
    }

    function getCoverUrl(manga, size = 512) {
      const rel = manga.relationships?.find(r => r.type === 'cover_art');
      if (!rel?.attributes?.fileName) return null;
      return `${COVER}/${manga.id}/${rel.attributes.fileName}.${size}.jpg`;
    }

    function getAuthor(manga) {
      const a = manga.relationships?.find(r => r.type === 'author');
      return a?.attributes?.name || null;
    }

    function getTags(manga) {
      return (manga.attributes?.tags || [])
        .filter(t => t.attributes?.group === 'genre' || t.attributes?.group === 'theme')
        .map(t => t.attributes?.name?.en)
        .filter(Boolean)
        .slice(0, 6);
    }

    async function fetchMangaList(orderKey = 'followedCount', limit = 30) {
      const params = new URLSearchParams({
        limit: String(limit),
        offset: '0',
        'hasAvailableChapters': 'true',
      });
      params.set(`order[${orderKey}]`, 'desc');
      params.append('availableTranslatedLanguage[]', 'en');
      params.append('contentRating[]', 'safe');
      params.append('contentRating[]', 'suggestive');
      params.append('includes[]', 'cover_art');
      params.append('includes[]', 'author');

      const res = await fetch(`${MD}/manga?${params}`);
      if (!res.ok) throw new Error('MangaDex request failed');
      const json = await res.json();
      return (json.data || []).map(m => ({
        id: m.id,
        title: getTitle(m),
        description: getDescription(m),
        cover: getCoverUrl(m) || 'https://placehold.co/400x600/0c0c0e/52525b?text=No+Cover',
        author: getAuthor(m),
        status: m.attributes?.status || 'unknown',
        tags: getTags(m),
        year: m.attributes?.year,
        source: 'mangadex',
      }));
    }

    async function fetchMangaChapters(mangaId, limit = 80) {
      const params = new URLSearchParams({
        limit: String(limit),
        'order[chapter]': 'asc',
        'includeEmptyPages': '0',
      });
      params.append('translatedLanguage[]', 'en');
      const res = await fetch(`${MD}/manga/${mangaId}/feed?${params}`);
      if (!res.ok) throw new Error('Failed to load chapters');
      const json = await res.json();
      return (json.data || []).map(ch => ({
        id: ch.id,
        number: ch.attributes?.chapter || '?',
        title: ch.attributes?.title || null,
        pageCount: ch.attributes?.pages || 0,
      })).filter(c => c.pageCount > 0);
    }

    async function fetchChapterPages(chapterId) {
      const res = await fetch(`${MD}/at-home/server/${chapterId}`);
      if (!res.ok) throw new Error('Failed to get chapter pages');
      const json = await res.json();
      const base = json.baseUrl;
      const hash = json.chapter?.hash;
      const data = json.chapter?.data || [];
      const dataSaver = json.chapter?.dataSaver || [];
      const files = data.length ? data : dataSaver;
      const quality = data.length ? 'data' : 'data-saver';
      if (!base || !hash || !files.length) return [];
      return files.map(f => `${base}/${quality}/${hash}/${f}`);
    }

    // State
    let mangas = [];          // currently displayed list
    let cache = {             // cache per tab
      popular: null,
      latest: null,
      ongoing: null,
      completed: null,
    };
    let view = { type: 'home' };
    let search = '';
    let activeTab = 'popular';
    let loading = true;
    let error = null;
    let chaptersCache = {};
    let readerMode = 'vertical';
    let currentPage = 0;
    let showControls = true;
    let loadingChapters = false;
    let loadingPages = false;

    const tabs = [
      { id: 'popular',  label: 'Popular' },
      { id: 'latest',   label: 'Latest' },
      { id: 'ongoing',  label: 'Ongoing' },
      { id: 'completed',label: 'Completed' },
    ];

    const app = document.getElementById('app');


    function setupMenu() {
      const btn = document.getElementById('menu-btn');
      const dropdown = document.getElementById('menu-dropdown');
      if (!btn || !dropdown) return;

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('hidden');
      });

      // Close when clicking outside
      document.addEventListener('click', () => {
        dropdown.classList.add('hidden');
      });

      dropdown.querySelectorAll('.menu-item').forEach(item => {
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          dropdown.classList.add('hidden');
          const action = item.dataset.action;
          if (action === 'settings') showSettings();
          if (action === 'about') showAbout();
        });
      });
    }

    function showSettings() {
      const modal = document.createElement('div');
      modal.id = 'modal-overlay';
      modal.className = 'fixed inset-0 z-[100] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4';
      modal.innerHTML = `
        <div class="bg-surface border border-border rounded-2xl w-full max-w-md shadow-2xl">
          <div class="flex items-center justify-between px-5 py-4 border-b border-border">
            <h2 class="text-base font-semibold text-text">Settings</h2>
            <button id="modal-close" class="text-muted hover:text-text text-xl leading-none">×</button>
          </div>
          <div class="p-5 space-y-4 text-sm">
            <div class="flex items-center justify-between">
              <span class="text-text/90">Reader default</span>
              <select id="setting-reader" class="bg-surface2 border border-border rounded-lg px-3 py-1.5 text-sm text-text">
                <option value="vertical" ${readerMode === 'vertical' ? 'selected' : ''}>Vertical scroll</option>
                <option value="paged" ${readerMode === 'paged' ? 'selected' : ''}>Paged</option>
              </select>
            </div>
            <p class="text-xs text-faint pt-2">More settings coming soon.</p>
          </div>
        </div>
      `;
      document.body.appendChild(modal);

      document.getElementById('modal-close').onclick = () => modal.remove();
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
      document.getElementById('setting-reader').onchange = (e) => {
        readerMode = e.target.value;
      };
    }

    function showAbout() {
      const modal = document.createElement('div');
      modal.id = 'modal-overlay';
      modal.className = 'fixed inset-0 z-[100] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4';
      modal.innerHTML = `
        <div class="bg-surface border border-border rounded-2xl w-full max-w-md shadow-2xl">
          <div class="flex items-center justify-between px-5 py-4 border-b border-border">
            <h2 class="text-base font-semibold text-text">About</h2>
            <button id="modal-close" class="text-muted hover:text-text text-xl leading-none">×</button>
          </div>
          <div class="p-5 space-y-3 text-sm text-muted leading-relaxed">
            <p class="text-text font-medium">Degraded</p>
            <p>A dark, minimal manga reader powered by the MangaDex API.</p>
            <p>Title font: Another Danger</p>
            <p class="pt-1">Owner: <span class="text-text">ShamblesRK</span></p>
            <p class="text-xs text-faint pt-2">Built for personal use. Not affiliated with MangaDex.</p>
          </div>
        </div>
      `;
      document.body.appendChild(modal);

      document.getElementById('modal-close').onclick = () => modal.remove();
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
    }

    function render() {
      if (view.type === 'home') renderHome();
      else if (view.type === 'detail') renderDetail();
      else if (view.type === 'reader') renderReader();
    }

    function filteredMangas() {
      let list = [...mangas];
      if (search.trim()) {
        const q = search.toLowerCase();
        list = list.filter(m =>
          m.title.toLowerCase().includes(q) ||
          m.tags.some(t => t.toLowerCase().includes(q)) ||
          (m.author || '').toLowerCase().includes(q)
        );
      }
      return list;
    }

    function renderHome() {
      const list = filteredMangas();

      app.innerHTML = `
        <header class="sticky top-0 z-50 border-b border-border bg-bg/95 backdrop-blur-xl">
          <div class="max-w-7xl xl:max-w-[90rem] mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
            <button id="logo" class="flex items-center gap-2 group">
              <span class="logo-degraded">DEGRADED</span>
            </button>
            <div class="relative">
              <button id="menu-btn" class="w-9 h-9 flex items-center justify-center rounded-lg text-muted hover:text-text hover:bg-surface2 transition text-xl leading-none" title="Menu">
                ···
              </button>
              <div id="menu-dropdown" class="hidden absolute right-0 top-full mt-1.5 w-44 bg-surface border border-border rounded-xl shadow-xl shadow-black/40 py-1.5 z-50">
                <button data-action="settings" class="menu-item w-full text-left px-4 py-2.5 text-sm text-text/90 hover:bg-surface2 hover:text-text transition">Settings</button>
                <button data-action="about" class="menu-item w-full text-left px-4 py-2.5 text-sm text-text/90 hover:bg-surface2 hover:text-text transition">About</button>
              </div>
            </div>
          </div>
        </header>

        <main class="max-w-7xl xl:max-w-[90rem] mx-auto px-4 sm:px-6 py-8">
          <div class="mb-10">
            <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-text mb-1">Browse</h1>
            <p class="text-sm text-muted">Real covers & chapters · darker by design</p>
          </div>

          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
            <div class="flex gap-6 border-b border-border">
              ${tabs.map(t => `
                <button data-tab="${t.id}" class="pb-2.5 text-sm font-medium transition ${activeTab === t.id ? 'tab-active' : 'tab-inactive'}">
                  ${t.label}
                </button>
              `).join('')}
            </div>
            <input id="search" type="search" placeholder="Search titles, tags…" value="${search}"
              class="w-full sm:w-64 bg-surface border border-border rounded-lg px-3.5 py-2 text-sm text-text placeholder:text-faint focus:outline-none focus:border-border2 focus:ring-1 focus:ring-accent/30 transition" />
          </div>

          ${loading ? `
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-5">
              ${Array.from({length:12}).map(() => `
                <div class="animate-pulse">
                  <div class="aspect-[2/3] rounded-lg bg-surface2 mb-2.5"></div>
                  <div class="h-3.5 bg-surface2 rounded w-3/4 mb-1.5"></div>
                  <div class="h-3 bg-surface2 rounded w-1/2"></div>
                </div>
              `).join('')}
            </div>
          ` : ''}

          ${error ? `
            <div class="py-20 text-center">
              <p class="text-red-400/90 mb-4 text-sm">${error}</p>
              <button id="retry" class="px-4 py-2 text-sm bg-surface2 border border-border rounded-lg hover:border-border2 transition">Retry</button>
            </div>
          ` : ''}

          ${!loading && !error ? `
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-5">
              ${list.map(m => `
                <button data-id="${m.id}" class="manga-card card-glow text-left group focus:outline-none focus-visible:ring-2 focus-visible:ring-accent/50 rounded-lg">
                  <div class="relative aspect-[2/3] overflow-hidden rounded-lg bg-surface border border-border mb-2.5">
                    <img src="${m.cover}" alt="${m.title}" loading="lazy"
                      class="w-full h-full object-cover transition duration-500 group-hover:scale-[1.03] group-hover:brightness-110"
                      onerror="this.src='https://placehold.co/400x600/0c0c0e/52525b?text=No+Cover'" />
                    <div class="absolute inset-x-0 bottom-0 h-1/3 bg-gradient-to-t from-black/70 to-transparent opacity-0 group-hover:opacity-100 transition"></div>
                    <div class="absolute bottom-2 left-2 right-2 opacity-0 group-hover:opacity-100 transition">
                      <span class="text-[10px] uppercase tracking-wider text-white/70 font-medium">${m.status}</span>
                    </div>
                  </div>
                  <h3 class="font-medium text-[13px] leading-snug line-clamp-2 text-text/95 group-hover:text-accent transition">${m.title}</h3>
                  ${m.author ? `<p class="text-[11px] text-muted mt-0.5 truncate">${m.author}</p>` : ''}
                </button>
              `).join('')}
            </div>
            ${list.length === 0 ? `<div class="py-24 text-center text-muted text-sm">Nothing matches.</div>` : ''}
          ` : ''}
        </main>

        <footer class="border-t border-border mt-20 py-10 text-center">
          <p class="text-xs text-faint font-mono">DEGRADED · by ShamblesRK · powered by mangadex</p>
        </footer>
      `;

      document.getElementById('logo')?.addEventListener('click', () => { view = { type: 'home' }; render(); });
      setupMenu();
      document.getElementById('search')?.addEventListener('input', e => { search = e.target.value; render(); });
      document.getElementById('retry')?.addEventListener('click', () => loadTab(activeTab));
      document.querySelectorAll('[data-tab]').forEach(el => {
        el.addEventListener('click', () => {
          activeTab = el.dataset.tab;
          loadTab(activeTab);
        });
      });
      document.querySelectorAll('.manga-card').forEach(el => {
        el.addEventListener('click', async () => {
          const manga = mangas.find(m => m.id === el.dataset.id);
          if (!manga) return;
          view = { type: 'detail', manga, chapters: null };
          render();
          if (!chaptersCache[manga.id]) {
            loadingChapters = true;
            render();
            try {
              chaptersCache[manga.id] = await fetchMangaChapters(manga.id);
            } catch {
              chaptersCache[manga.id] = [];
            }
            loadingChapters = false;
          }
          view = { type: 'detail', manga, chapters: chaptersCache[manga.id] };
          render();
        });
      });
    }

    function renderDetail() {
      const { manga, chapters } = view;
      const chList = chapters || [];

      app.innerHTML = `
        <header class="sticky top-0 z-50 border-b border-border bg-bg/95 backdrop-blur-xl">
          <div class="max-w-7xl xl:max-w-[90rem] mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
            <button id="logo" class="logo-degraded">DEGRADED</button>
            <div class="relative">
              <button id="menu-btn" class="w-9 h-9 flex items-center justify-center rounded-lg text-muted hover:text-text hover:bg-surface2 transition text-xl leading-none" title="Menu">
                ···
              </button>
              <div id="menu-dropdown" class="hidden absolute right-0 top-full mt-1.5 w-44 bg-surface border border-border rounded-xl shadow-xl shadow-black/40 py-1.5 z-50">
                <button data-action="settings" class="menu-item w-full text-left px-4 py-2.5 text-sm text-text/90 hover:bg-surface2 hover:text-text transition">Settings</button>
                <button data-action="about" class="menu-item w-full text-left px-4 py-2.5 text-sm text-text/90 hover:bg-surface2 hover:text-text transition">About</button>
              </div>
            </div>
          </div>
        </header>

        <main class="max-w-7xl xl:max-w-[90rem] mx-auto px-4 sm:px-6 py-8">
          <button id="back" class="mb-8 text-sm text-muted hover:text-text transition flex items-center gap-1.5">
            <span class="text-faint">←</span> Back
          </button>

          <div class="flex flex-col md:flex-row gap-10">
            <div class="shrink-0 w-full max-w-[220px] mx-auto md:mx-0">
              <div class="relative rounded-xl overflow-hidden border border-border shadow-2xl shadow-black/50">
                <img src="${manga.cover}" alt="${manga.title}" class="w-full"
                  onerror="this.src='https://placehold.co/400x600/0c0c0e/52525b?text=No+Cover'" />
              </div>
            </div>

            <div class="flex-1 min-w-0">
              <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-text mb-3 leading-tight">${manga.title}</h1>
              
              <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mb-5 text-sm text-muted">
                ${manga.author ? `<span>${manga.author}</span>` : ''}
                ${manga.year ? `<span class="text-faint">·</span><span>${manga.year}</span>` : ''}
                <span class="text-faint">·</span>
                <span class="capitalize">${manga.status}</span>
              </div>

              <div class="flex flex-wrap gap-1.5 mb-6">
                ${manga.tags.map(t => `
                  <span class="px-2.5 py-1 text-[11px] rounded-md bg-surface2 border border-border text-muted">${t}</span>
                `).join('')}
              </div>

              <p class="text-sm text-muted/90 leading-relaxed mb-10 max-w-2xl">${manga.description.slice(0, 600)}${manga.description.length > 600 ? '…' : ''}</p>

              <div class="flex items-center justify-between mb-4">
                <h2 class="text-base font-medium text-text">Chapters</h2>
                <span class="text-xs text-faint font-mono">${loadingChapters ? 'loading…' : chList.length + ' available'}</span>
              </div>

              ${loadingChapters ? `
                <div class="space-y-2">
                  ${Array.from({length:6}).map(() => `<div class="h-12 rounded-lg bg-surface2 animate-pulse"></div>`).join('')}
                </div>
              ` : `
                <div class="space-y-1.5 max-h-[480px] overflow-y-auto pr-1">
                  ${chList.length === 0 ? `<p class="text-sm text-muted py-8 text-center">No English chapters found.</p>` : ''}
                  ${chList.map(ch => `
                    <button data-ch="${ch.id}" class="chapter-btn w-full flex items-center justify-between px-4 py-3 rounded-lg bg-surface border border-border hover:border-border2 hover:bg-surface2 transition text-left group">
                      <span class="text-sm font-medium text-text/90 group-hover:text-accent transition">
                        Ch. ${ch.number}${ch.title ? ` <span class="text-muted font-normal">— ${ch.title}</span>` : ''}
                      </span>
                      <span class="text-[11px] text-faint group-hover:text-muted transition">Read</span>
                    </button>
                  `).join('')}
                </div>
              `}
            </div>
          </div>
        </main>
      `;

      document.getElementById('logo')?.addEventListener('click', () => { view = { type: 'home' }; render(); });
      setupMenu();
      document.getElementById('back')?.addEventListener('click', () => { view = { type: 'home' }; render(); });
      document.querySelectorAll('.chapter-btn').forEach(el => {
        el.addEventListener('click', async () => {
          const chapter = chList.find(c => c.id === el.dataset.ch);
          if (!chapter) return;
          view = { type: 'reader', manga, chapter, pages: null };
          currentPage = 0;
          loadingPages = true;
          render();
          try {
            const pages = await fetchChapterPages(chapter.id);
            view = { type: 'reader', manga, chapter, pages };
          } catch {
            view = { type: 'reader', manga, chapter, pages: [] };
          }
          loadingPages = false;
          render();
        });
      });
    }

    function renderReader() {
      const { manga, chapter, pages } = view;
      const pageList = pages || [];

      if (loadingPages) {
        app.innerHTML = `
          <div class="min-h-screen flex items-center justify-center bg-bg">
            <div class="text-center">
              <div class="w-8 h-8 border-2 border-accent/30 border-t-accent rounded-full animate-spin mx-auto mb-4"></div>
              <p class="text-sm text-muted">Loading pages…</p>
            </div>
          </div>`;
        return;
      }

      if (pageList.length === 0) {
        app.innerHTML = `
          <div class="min-h-screen flex items-center justify-center bg-bg">
            <div class="text-center">
              <p class="text-muted mb-4 text-sm">Could not load pages for this chapter.</p>
              <button id="back" class="text-accent text-sm hover:underline">← Back to chapters</button>
            </div>
          </div>`;
        document.getElementById('back')?.addEventListener('click', () => {
          view = { type: 'detail', manga, chapters: chaptersCache[manga.id] || [] };
          render();
        });
        return;
      }

      app.innerHTML = `
        <div class="relative">
          <div class="sticky top-0 z-40 border-b border-border bg-bg/90 backdrop-blur-xl transition-opacity ${showControls ? 'opacity-100' : 'opacity-0 pointer-events-none'}">
            <div class="max-w-5xl mx-auto px-4 py-2.5 flex items-center justify-between gap-4 text-sm">
              <div class="flex items-center gap-3 min-w-0">
                <button id="back-ch" class="text-muted hover:text-text shrink-0 transition">←</button>
                <span class="truncate text-[13px] text-text/90">
                  ${manga.title} <span class="text-faint">·</span> Ch. ${chapter.number}
                </span>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <button id="mode-v" class="px-2.5 py-1 rounded text-[11px] font-medium transition ${readerMode === 'vertical' ? 'bg-accent text-white' : 'bg-surface2 text-muted hover:text-text'}">Scroll</button>
                <button id="mode-p" class="px-2.5 py-1 rounded text-[11px] font-medium transition ${readerMode === 'paged' ? 'bg-accent text-white' : 'bg-surface2 text-muted hover:text-text'}">Pages</button>
                ${readerMode === 'paged' ? `<span class="text-[11px] text-faint ml-1.5 font-mono">${currentPage + 1}/${pageList.length}</span>` : ''}
              </div>
            </div>
          </div>

          <div id="reader-area" class="bg-black min-h-[80vh]">
            ${readerMode === 'vertical' ? `
              <div class="flex flex-col items-center max-w-3xl lg:max-w-4xl xl:max-w-5xl mx-auto">
                ${pageList.map((src, i) => `
                  <img src="${src}" alt="Page ${i+1}" class="manga-page w-full" loading="${i < 4 ? 'eager' : 'lazy'}"
                    onerror="this.style.display='none'" />
                `).join('')}
              </div>
            ` : `
              <div class="flex flex-col items-center justify-center min-h-[80vh] relative select-none">
                <img src="${pageList[currentPage]}" alt="Page ${currentPage+1}"
                  class="manga-page max-h-[88vh] object-contain"
                  onerror="this.src='https://placehold.co/800x1200/050506/333?text=Missing'" />
                <button id="prev-zone" class="absolute left-0 top-0 bottom-0 w-[30%] cursor-w-resize opacity-0" aria-label="Previous"></button>
                <button id="next-zone" class="absolute right-0 top-0 bottom-0 w-[30%] cursor-e-resize opacity-0" aria-label="Next"></button>
              </div>
            `}
          </div>

          ${readerMode === 'paged' ? `
            <div class="fixed bottom-5 left-1/2 -translate-x-1/2 flex gap-2 z-40">
              <button id="prev-btn" class="px-4 py-2 bg-surface/90 border border-border rounded-lg text-xs text-text backdrop-blur disabled:opacity-30" ${currentPage === 0 ? 'disabled' : ''}>Prev</button>
              <button id="next-btn" class="px-4 py-2 bg-surface/90 border border-border rounded-lg text-xs text-text backdrop-blur disabled:opacity-30" ${currentPage >= pageList.length - 1 ? 'disabled' : ''}>Next</button>
            </div>
          ` : ''}
        </div>
      `;

      document.getElementById('back-ch')?.addEventListener('click', () => {
        view = { type: 'detail', manga, chapters: chaptersCache[manga.id] || [] };
        render();
      });
      document.getElementById('mode-v')?.addEventListener('click', () => { readerMode = 'vertical'; render(); });
      document.getElementById('mode-p')?.addEventListener('click', () => { readerMode = 'paged'; render(); });
      document.getElementById('reader-area')?.addEventListener('click', (e) => {
        if (e.target.closest('#prev-zone') || e.target.closest('#next-zone')) return;
        showControls = !showControls;
        render();
      });

      const goPrev = () => { if (currentPage > 0) { currentPage--; render(); } };
      const goNext = () => { if (currentPage < pageList.length - 1) { currentPage++; render(); } };

      document.getElementById('prev-btn')?.addEventListener('click', e => { e.stopPropagation(); goPrev(); });
      document.getElementById('next-btn')?.addEventListener('click', e => { e.stopPropagation(); goNext(); });
      document.getElementById('prev-zone')?.addEventListener('click', e => { e.stopPropagation(); goPrev(); });
      document.getElementById('next-zone')?.addEventListener('click', e => { e.stopPropagation(); goNext(); });

      window.onkeydown = (e) => {
        if (view.type !== 'reader') return;
        if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goNext(); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
        if (e.key === 'Escape') {
          view = { type: 'detail', manga, chapters: chaptersCache[manga.id] || [] };
          render();
        }
      };
    }

    async function loadTab(tabId) {
      activeTab = tabId;
      // Use cache if available
      if (cache[tabId]) {
        mangas = cache[tabId];
        loading = false;
        error = null;
        render();
        return;
      }

      loading = true;
      error = null;
      render();

      try {
        let list = [];
        if (tabId === 'popular') {
          list = await fetchMangaList('followedCount', 36);
        } else if (tabId === 'latest') {
          list = await fetchMangaList('latestUploadedChapter', 36);
        } else if (tabId === 'ongoing') {
          // Fetch popular then filter, or do a status-filtered call
          const all = await fetchMangaList('followedCount', 60);
          list = all.filter(m => m.status === 'ongoing').slice(0, 36);
        } else if (tabId === 'completed') {
          const all = await fetchMangaList('followedCount', 80);
          list = all.filter(m => m.status === 'completed').slice(0, 36);
        }
        cache[tabId] = list;
        mangas = list;
      } catch (e) {
        error = e.message || 'Failed to reach MangaDex';
        mangas = [];
      } finally {
        loading = false;
        render();
      }
    }

    // Initial load
    loadTab('popular');
  </script>
</body>
</html>
